// Build file for the FTC test harness. Run tests with:  gradlew test
// This is a plain Java build (no Android plugin) and is completely separate from the
// robot build in the repository root.

// Classes this build script itself uses (for unzipping .aar files).
import java.util.zip.ZipFile
import org.gradle.api.artifacts.transform.InputArtifact
import org.gradle.api.artifacts.transform.TransformAction
import org.gradle.api.artifacts.transform.TransformOutputs
import org.gradle.api.artifacts.transform.TransformParameters

plugins {
    // Standard Java project: compile, test, jar.
    id 'java'
}

// ---------------------------------------------------------------------------
// Settings from harness.properties: the one file to change when the harness is
// dropped into another FTC repo (README.md, "The config file"). Java reads the same
// file through pvi.harness.runtime.HarnessConfig.
// ---------------------------------------------------------------------------
def harnessSettings = new Properties()
file('harness.properties').withReader('UTF-8') { harnessSettings.load(it) }
if (harnessSettings.getProperty('config.version')?.trim() != '3') {
    throw new GradleException("harness.properties: this harness reads config.version 3, the file says "
            + "${harnessSettings.getProperty('config.version')}. See README.md, \"The config file\".")
}
// One setting by name, with a clear error if it is missing.
def setting = { String key ->
    String value = harnessSettings.getProperty(key)?.trim()
    if (!value) {
        throw new GradleException("harness.properties: ${key} is missing. See README.md, \"The config file\".")
    }
    value
}

// ---------------------------------------------------------------------------
// The robot code is compiled straight from TeamCode. Nothing is copied, so the
// harness always tests whatever is currently checked out.
// ---------------------------------------------------------------------------
def teamCodeSrc = file(setting('teamCode.sourceDir'))
if (!teamCodeSrc.isDirectory()) {
    throw new GradleException("harness.properties: teamCode.sourceDir points to ${teamCodeSrc}, which is not a folder.")
}
// true or false: build PVI's own extras (see the source sets below).
def pviExtrasSetting = setting('pvi.extras')
if (!(pviExtrasSetting in ['true', 'false'])) {
    throw new GradleException("harness.properties: pvi.extras must be true or false, got \"${pviExtrasSetting}\".")
}
def pviExtras = pviExtrasSetting == 'true'

sourceSets {
    // The Java agent (src/agent/java) is built separately: it is packaged as its own jar
    // and loaded by the test JVM before any robot class, so it can redirect their clocks.
    agent
    // "main" = the harness (src/main/java) plus TeamCode, compiled together.
    main {
        java {
            srcDir teamCodeSrc
            // PVI's own extras (pvi.extras=true): src/pvi/java reads Team A's Pedro configuration.
            // The core never uses them, so another repo sets pvi.extras=false and builds without.
            if (pviExtras) srcDir 'src/pvi/java'
        }
    }
    test {
        java {
            // The PVI extras' tests, e.g. that harness.properties still matches Team A's Pedro values.
            if (pviExtras) srcDir 'src/pviTest/java'
        }
    }
    // "viewer" (src/viewer/java) = the desktop field viewer (Swing). It is kept apart from
    // "main" so the simulation core can never use window code: viewer may use main, but
    // main cannot even see viewer. See ai-instructions/05-desktop-viewer.md.
    viewer {
        java {
            // PVI's hand-made viewer scenarios (pvi.extras=true): src/pviViewer/java names Team A's
            // OpModes, so another repo builds the viewer without it (manager decision D11).
            if (pviExtras) srcDir 'src/pviViewer/java'
        }
    }
    // "bridge" (src/bridge/java) = the connection to Unity (a local socket). Kept apart from
    // "main" for the same reason as the viewer: the simulation core never contains network
    // code. See ai-instructions/02-unity-readiness.md.
    bridge
    // "test" (src/test/java) is set up automatically by the java plugin.
}

configurations {
    // The viewer compiles and runs against everything the harness core uses.
    viewerImplementation.extendsFrom implementation
    // So does the Unity bridge.
    bridgeImplementation.extendsFrom implementation
}

// ---------------------------------------------------------------------------
// Java: the harness builds and runs on the Java that runs Gradle (JAVA_HOME, or java on the
// PATH), if it is Java 17 or newer. Android Studio's built-in Java (its "jbr" folder) works.
// No fixed version is required, so another PC needs no extra download. Gradle 9 itself
// already refuses to start on anything older than 17; this check says so in plain words.
// ---------------------------------------------------------------------------
if (!JavaVersion.current().isCompatibleWith(JavaVersion.VERSION_17)) {
    throw new GradleException("The harness needs Java 17 or newer, but Gradle is running on Java "
            + "${JavaVersion.current()} (${System.getProperty('java.home')}). Install Android Studio, or a "
            + "Java 17+ JDK such as Eclipse Temurin from https://adoptium.net, and set JAVA_HOME to it.")
}
// JVM options that only some Java versions know. An option a Java doesn't know stops it from
// starting, so each one is added only where it exists. Every test and JavaExec task uses these.
def runJvmArgs = []
if (JavaVersion.current().isCompatibleWith(JavaVersion.VERSION_23)) {
    // Byte Buddy probes sun.misc.Unsafe at startup; this silences Java 23+'s warning about it.
    runJvmArgs << '--sun-misc-unsafe-memory-access=allow'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // TeamCode targets Java 8; compile at 17 so harness code can use modern Java.
    options.release = 17
    // Hide compiler style warnings about TeamCode/SDK code we don't control.
    options.compilerArgs += ['-Xlint:none', '-nowarn']
}

// Where libraries are downloaded from (the same places the robot build uses).
// The robot build's own extra Maven repositories (for example Pedro's), read from the same
// dependency file as the libraries below, so a team that switches library source needs no change here.
def hostRepositoryUrls = []
(file(setting('host.dependenciesFile')).getText('UTF-8') =~ /(?m)^\s*maven\s*\{\s*url\s*=?\s*\(?\s*['"]([^'"]+)['"]/).each { match ->
    hostRepositoryUrls << match[1]
}

repositories {
    mavenCentral()                                    // FTC SDK, JUnit, Byte Buddy, Robolectric
    google()                                          // Android support libraries
    hostRepositoryUrls.each { hostUrl -> maven { url = hostUrl } }   // e.g. Pedro's repo.dairy.foundation
}

// ---------------------------------------------------------------------------
// The FTC SDK and Pedro are published as Android .aar archives. A plain JVM
// cannot read those, so this transform pulls classes.jar (and any bundled
// libs/*.jar) out of each .aar.
// ---------------------------------------------------------------------------
// Gradle labels every downloaded file with its type ("aar", "jar", ...).
def artifactType = Attribute.of('artifactType', String)

// Turns one .aar file into one or more .jar files.
abstract class AarToJar implements TransformAction<TransformParameters.None> {
    // The .aar file being converted (Gradle fills this in).
    @InputArtifact
    abstract Provider<FileSystemLocation> getInputArtifact()

    @Override
    void transform(TransformOutputs outputs) {
        File aar = inputArtifact.get().asFile
        String base = aar.name.replaceAll(/\.aar$/, '')       // e.g. "RobotCore-12.0.0"
        // An .aar is a zip file; look inside it.
        new ZipFile(aar).withCloseable { zip ->
            zip.entries().each { entry ->
                String target = null
                if (entry.name == 'classes.jar') {
                    // The compiled Java classes: the part we need.
                    target = "${base}.jar"
                } else if (entry.name.startsWith('libs/') && entry.name.endsWith('.jar')) {
                    // Extra jars some libraries bundle inside their .aar.
                    target = "${base}-${entry.name.substring(5)}"
                }
                if (target != null) {
                    // Copy that jar out of the zip.
                    File out = outputs.file(target)
                    zip.getInputStream(entry).withCloseable { input -> out.bytes = input.bytes }
                }
            }
        }
    }
}

dependencies {
    // Tell Gradle: whenever a "jar" is wanted but only an "aar" exists, use AarToJar.
    registerTransform(AarToJar) {
        from.attribute(artifactType, 'aar')
        to.attribute(artifactType, 'jar')
    }
}

configurations {
    // The robot build's libraries, read from its build.dependencies.gradle (below).
    robotLibs {
        canBeConsumed = false   // nothing else depends on this list...
        canBeResolved = true    // ...but it can be downloaded
    }
}

// The robot libraries TeamCode uses: every "implementation 'group:name:version'" (or "api")
// line in the robot build's dependency file, which is only read, never changed. Libraries
// that only work on Android are left out (host.skipLibraries). So when the team upgrades the
// SDK or Pedro, the harness uses the new versions automatically.
def hostDependencies = file(setting('host.dependenciesFile'))
if (!hostDependencies.isFile()) {
    throw new GradleException("harness.properties: host.dependenciesFile points to ${hostDependencies}, which is not a file.")
}
def skipLibraries = (harnessSettings.getProperty('host.skipLibraries') ?: '')
        .split(',').collect { it.trim() }.findAll { it }
def robotLibraries = []   // "group:name:version", in the order the robot build lists them
(hostDependencies.getText('UTF-8') =~ /(?m)^\s*(?:implementation|api)\s*\(?\s*['"]([^:'"]+):([^:'"]+):([^:'"]+)['"]/).each { match ->
    if (!skipLibraries.contains("${match[1]}:${match[2]}".toString())) {
        robotLibraries << "${match[1]}:${match[2]}:${match[3]}".toString()
    }
}
if (robotLibraries.isEmpty()) {
    throw new GradleException("Found no \"implementation 'group:name:version'\" lines in ${hostDependencies}"
            + " (after host.skipLibraries). Check host.dependenciesFile in harness.properties.")
}

dependencies {
    robotLibraries.each { robotLibs it }
}

// The robot libraries (and everything they depend on) as plain .jar files, via AarToJar.
def robotLibJars = configurations.robotLibs.incoming.artifactView {
    attributes { attribute(artifactType, 'jar') }
}.files

dependencies {
    // Harness + TeamCode compile against the robot libraries.
    implementation robotLibJars

    // The viewer reads the core's plain-data records (RunRecording, Pose, ...).
    viewerImplementation sourceSets.main.output
    // Tests may check the viewer too (always headless; see the test task below).
    testImplementation sourceSets.viewer.output
    // The Unity bridge uses the core, and tests check it (with a fake client, no Unity needed).
    bridgeImplementation sourceSets.main.output
    // For Unity live play the harness reads the game controllers (decided 2026-10-24), with the
    // viewer's controller code (no window is opened) and Jamepad, the same version as the viewer.
    bridgeImplementation sourceSets.viewer.output
    bridgeImplementation 'com.badlogicgames.jamepad:jamepad:2.30.0.0'
    testImplementation sourceSets.bridge.output

    // Jamepad (SDL): reads USB and wireless game controllers for live driving in the viewer.
    // Approved by the team on 2026-10-18; viewer only, never the core or the robot build.
    // Tests get it only so viewer classes load; they never open a controller.
    viewerImplementation 'com.badlogicgames.jamepad:jamepad:2.30.0.0'
    testImplementation 'com.badlogicgames.jamepad:jamepad:2.30.0.0'

    // SimTime lives with the agent; the harness and tests need it even if the agent is not loaded.
    implementation sourceSets.agent.output

    // Real Android framework classes that run on a desktop JVM (API 34, matching compileSdk).
    implementation 'org.robolectric:android-all:14-robolectric-10818077'

    // JUnit 5: runs the tests (@Test) and provides assertEquals and friends.
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Byte Buddy: the library the agent uses to rewrite clock calls in loaded classes.
    agentImplementation 'net.bytebuddy:byte-buddy:1.17.7'
}

// ---------------------------------------------------------------------------
// harness-agent.jar: the agent plus Byte Buddy in one jar, with the manifest
// entry that tells Java to run HarnessAgent.premain before anything else.
// ---------------------------------------------------------------------------
def agentJar = tasks.register('agentJar', Jar) {
    archiveFileName = 'harness-agent.jar'
    destinationDirectory = layout.buildDirectory.dir('agent')   // build/agent/harness-agent.jar
    // The agent's own classes...
    from sourceSets.agent.output
    // ...plus Byte Buddy unpacked into the same jar, so the agent works on its own.
    from({ configurations.agentRuntimeClasspath.collect { zipTree(it) } }) {
        // Leave out Byte Buddy's own manifest, signatures and module descriptors, which
        // would conflict with ours.
        exclude 'META-INF/MANIFEST.MF', 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA',
                'module-info.class', 'META-INF/versions/*/module-info.class'
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes(
                'Premain-Class': 'pvi.harness.agent.HarnessAgent',   // run this class's premain first
                'Can-Redefine-Classes': 'true',                      // permissions Java agents ask for
                'Can-Retransform-Classes': 'true'
        )
    }
}

// When the test run started, so viewAfterTests (below) can tell this run's recordings from older ones.
def testRunStartMillis = 0L

tasks.named('test') {
    // Run JUnit 5 tests.
    useJUnitPlatform()
    doFirst { testRunStartMillis = System.currentTimeMillis() }
    // Step 15, option A: with viewer.open=true, open the viewer when the tests are done (pass or fail).
    finalizedBy 'viewAfterTests'
    // Always run the tests, even when nothing changed since the last run. Otherwise Gradle
    // prints "UP-TO-DATE" and skips them, and output such as position reports never appears.
    outputs.upToDateWhen { false }
    // Build the agent jar first, then start the test JVM with -javaagent pointing at it.
    dependsOn agentJar
    def agentFile = agentJar.flatMap { it.archiveFile }
    jvmArgumentProviders.add({ ["-javaagent:${agentFile.get().asFile.absolutePath}"] } as CommandLineArgumentProvider)
    // Tests never open a window: with headless mode on, any attempt fails instead of showing
    // one, and the viewer's drawing code still works on off-screen images.
    systemProperty 'java.awt.headless', 'true'
    // The robot libraries this build really uses ("group:name:version", comma-separated), so
    // SdkCompatibilityTest can check them against the robot build.
    systemProperty 'harness.robotLibraries', robotLibraries.join(',')
    jvmArgs runJvmArgs   // only the options this Java knows (see the top of this file)
    // What to print while tests run.
    testLogging {
        events 'passed', 'failed', 'skipped'   // one line per test
        exceptionFormat = 'full'               // full error message and stack trace on failure
        showStandardStreams = true             // show anything tests print
    }
}

// ---------------------------------------------------------------------------
// viewAfterTests: runs right after "test". Only with viewer.open=true in harness.properties
// (default false): opens the viewer on this run's newest recording, or the failed test's
// (pvi.harness.viewer.AfterTestsViewer). With no screen it prints one line and stays closed.
// The tests themselves never open a window; close the viewer to let Gradle finish.
// ---------------------------------------------------------------------------
tasks.register('viewAfterTests', JavaExec) {
    group = 'harness'
    description = 'After the tests: opens the viewer on the run\'s newest (or failed) recording, if viewer.open=true.'
    onlyIf { setting('viewer.open') == 'true' }
    classpath = sourceSets.viewer.runtimeClasspath
    mainClass = 'pvi.harness.viewer.AfterTestsViewer'
    workingDir = projectDir
    // The viewer's dropdown can run scenarios (real TeamCode), so load the Java agent as tests do.
    dependsOn agentJar
    def afterTestsAgentFile = agentJar.flatMap { it.archiveFile }
    jvmArgumentProviders.add({ ["-javaagent:${afterTestsAgentFile.get().asFile.absolutePath}"] } as CommandLineArgumentProvider)
    jvmArgs runJvmArgs   // only the options this Java knows (see the top of this file)
    def resultsFolder = layout.buildDirectory.dir('test-results/test')
    argumentProviders.add({ [testRunStartMillis.toString(), resultsFolder.get().asFile.absolutePath] } as CommandLineArgumentProvider)
}

// ---------------------------------------------------------------------------
// viewRecording: opens the desktop viewer window (replay recordings, run scenarios).
//   .\gradlew.bat viewRecording                       (drive Team A TeleOp live)
//   .\gradlew.bat viewRecording -Pfile=build\recordings\teamAAutonomous.json
// Only this task opens a window; "test" never does (it runs headless).
// ---------------------------------------------------------------------------
tasks.register('viewRecording', JavaExec) {
    group = 'harness'
    description = 'Opens the viewer window: drives a TeleOp live, replays recordings (build/recordings), runs scenarios.'
    classpath = sourceSets.viewer.runtimeClasspath
    mainClass = 'pvi.harness.viewer.RecordingViewer'
    workingDir = projectDir
    // The dropdown can run scenarios (real TeamCode), so load the Java agent as tests do:
    // otherwise timed robot code would read the real clock.
    dependsOn agentJar
    def viewerAgentFile = agentJar.flatMap { it.archiveFile }
    jvmArgumentProviders.add({ ["-javaagent:${viewerAgentFile.get().asFile.absolutePath}"] } as CommandLineArgumentProvider)
    jvmArgs runJvmArgs   // only the options this Java knows (see the top of this file)
    if (project.hasProperty('file')) {
        args project.property('file')
    }
}

// ---------------------------------------------------------------------------
// makeTest: turns a saved recording (for example a drive recorded in the viewer) into a new
// test in src/test/java/pvi/harness/recorded/. Never replaces an existing file.
//   .\gradlew.bat makeTest                                          (newest drive-*.json)
//   .\gradlew.bat makeTest "-Pfile=build\recordings\drive-....json"
//   .\gradlew.bat makeTest "-Pfile=..." "-PtestName=IntakeDriveTest"  (choose the class name)
// ---------------------------------------------------------------------------
tasks.register('makeTest', JavaExec) {
    group = 'harness'
    description = 'Turns a saved recording into a new, editable test in src/test/java/pvi/harness/recorded.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'pvi.harness.recorded.MakeRecordedTest'
    workingDir = projectDir
    // It replays the inputs on the real OpMode for the snapshot checks, so load the Java agent
    // as tests do: otherwise timed robot code would read the real clock.
    dependsOn agentJar
    def makeTestAgentFile = agentJar.flatMap { it.archiveFile }
    jvmArgumentProviders.add({ ["-javaagent:${makeTestAgentFile.get().asFile.absolutePath}"] } as CommandLineArgumentProvider)
    jvmArgs runJvmArgs   // only the options this Java knows (see the top of this file)
    systemProperty 'java.awt.headless', 'true'
    args(project.findProperty('file') ?: '', project.findProperty('testName') ?: '')
}

// ---------------------------------------------------------------------------
// unityBridge: runs the harness side of the live Unity connection (Stage U2).
//   .\gradlew.bat unityBridge                 (listens on 127.0.0.1:7465)
//   .\gradlew.bat unityBridge -Pport=7500
// Unity connects, picks an OpMode, and asks for one OpMode call at a time. The message format
// is in README.md, "Live connection to Unity". Stop it with Ctrl+C.
// ---------------------------------------------------------------------------
tasks.register('unityBridge', JavaExec) {
    group = 'harness'
    description = 'Runs the harness side of the live Unity connection (local socket, port 7465 by default).'
    classpath = sourceSets.bridge.runtimeClasspath
    mainClass = 'pvi.harness.bridge.BridgeServer'
    workingDir = projectDir
    // Robot code runs here, so load the Java agent as tests do: otherwise timed code would
    // read the real clock.
    dependsOn agentJar
    def bridgeAgentFile = agentJar.flatMap { it.archiveFile }
    jvmArgumentProviders.add({ ["-javaagent:${bridgeAgentFile.get().asFile.absolutePath}"] } as CommandLineArgumentProvider)
    jvmArgs runJvmArgs   // only the options this Java knows (see the top of this file)
    if (project.hasProperty('port')) {
        args project.property('port')
    }
}
