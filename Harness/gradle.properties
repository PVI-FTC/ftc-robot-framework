# Settings for the Gradle process that builds and tests the harness.
# -Xmx2g: allow up to 2 GB of memory (compiling TeamCode plus the FTC libraries needs room).
# -Dfile.encoding=UTF-8: read source files as UTF-8 so characters like ° work everywhere.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
