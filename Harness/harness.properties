# Harness settings: the one file to change when the harness is dropped into another FTC repo.
# Every key is explained in README.md, section "The config file (harness.properties)".
# Lines starting with # are comments. Paths are relative to this Harness folder.

# Which layout of this file the harness expects. Goes up when keys change.
config.version=1

# --- Build (read by build.gradle) ------------------------------------------------------------

# The robot code to compile and test. It is only read, never changed.
teamCode.sourceDir=../TeamCode/src/main/java
# The robot build's library list. The harness uses the same libraries and versions.
host.dependenciesFile=../build.dependencies.gradle
# Libraries in that list that only work on Android, so the harness leaves them out.
host.skipLibraries=org.firstinspires.ftc:Inspection,org.firstinspires.ftc:Blocks,\
  org.firstinspires.ftc:RobotServer,org.firstinspires.ftc:OnBotJava,androidx.appcompat:appcompat

# --- Robot profile (read by HarnessConfig) ---------------------------------------------------

# Names in the robot configuration, the same strings TeamCode passes to hardwareMap.get(...).
drive.frontLeft=frontLeft
drive.frontRight=frontRight
drive.rearLeft=rearLeft
drive.rearRight=rearRight
pinpoint=pinpoint

# Robot facts. Each is: number | measured or placeholder | where it came from (or how to measure).
# Change "placeholder" to "measured" only after measuring on the real robot (see CALIBRATION.md).
robot.lengthInches=18 | placeholder | unverified; FTC maximum starting size. Measure bumper to bumper
robot.widthInches=18 | placeholder | unverified; FTC maximum starting size. Measure bumper to bumper
drive.turnRateDegreesPerSecond=180 | placeholder | not recorded; spin at full power for 1 s and measure the degrees turned
drive.responseTimeSeconds=0.10 | placeholder | not measured; typical for goBILDA 312 rpm drive motors. Measure: time from full power to 63% of full speed
drive.maxAccelerationInchesPerSecondSquared=200 | placeholder | not measured; about half of gravity, a usual traction limit for mecanum wheels on foam tiles. Measure: fastest speed-up from rest at full power
drive.speedVoltage=12.5 | placeholder | not recorded; battery voltage when Pedro's velocity tuners ran. Write it down next time the tuners run

# --- Field and viewer ------------------------------------------------------------------------

# The season field, a file in fields/ without ".json".
field=biobuzz-2026
# Step 15 (not built yet): open the viewer window after a run. Normal test runs never open a
# window, whatever this says.
viewer.open=false
