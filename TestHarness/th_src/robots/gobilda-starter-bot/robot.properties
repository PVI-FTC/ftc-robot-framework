# The goBILDA FTC Starter Bot (2026-2027 season), drawn by the Unity replay in place of the robot box.
# Only how the robot looks: its size for physics and the harness still comes from harness.properties.
# Model: goBILDA's STEP (3200-2627-0003), converted to OBJ, slimmed by slim_model.py in this folder.
name=goBILDA Starter Bot
source=https://www.gobilda.com/ftc-starter-bot-resource-guide-2026-2027-season/
# The model's path under unity/Assets/HarnessReplay/Resources, without .obj
model=Robots/gobilda-starter-bot/gobilda-starter-bot
# The OBJ is in millimeters, z up; the front (where the mechanism sticks out) is -y.
model.metersPerUnit=0.001
model.forward=-y
model.up=+z
# The robot's center: between the middle drive wheels (it's also the model's origin).
model.centerX=0
model.centerY=0
model.centerZ=0
# Six-wheel drive: the front and middle wheels on each side turn with that side's front motor.
wheel.frontLeft=wheelLeftFront, wheelLeftMiddle
wheel.frontRight=wheelRightFront, wheelRightMiddle
wheel.rearLeft=wheelLeftRear
wheel.rearRight=wheelRightRear
