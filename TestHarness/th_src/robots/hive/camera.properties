# The Hive robot's Limelight 3A, as a harness camera, so a replay shows what it sees. Hive Auto reads
# the fake Limelight; HiveAutoRecordingTest feeds it from this camera's picture. Every mount number
# is HiveField's placeholder. Change both when the mount is measured.
devices.webcams=limelightCamera
webcam.limelightCamera.forwardInches=8.0 | placeholder | HiveField CAMERA_FORWARD_INCHES, not measured
webcam.limelightCamera.leftInches=0 | placeholder | assumed centered, not measured
webcam.limelightCamera.upInches=20.0 | placeholder | HiveField CAMERA_HEIGHT_INCHES, not measured
webcam.limelightCamera.yawDegrees=0 | placeholder | assumed straight ahead, not measured
webcam.limelightCamera.pitchDegrees=25 | placeholder | HiveField CAMERA_TILT_DEGREES, not measured
webcam.limelightCamera.rollDegrees=0 | placeholder | assumed level, not measured
webcam.limelightCamera.horizontalFovDegrees=54.5 | placeholder | Limelight 3A's listed field of view, not measured
webcam.limelightCamera.verticalFovDegrees=42 | placeholder | Limelight 3A's listed field of view, not measured
webcam.limelightCamera.imageWidthPixels=640 | placeholder | guess
webcam.limelightCamera.imageHeightPixels=480 | placeholder | guess
webcam.limelightCamera.maxRangeInches=120 | placeholder | guess
webcam.limelightCamera.maxViewAngleDegrees=60 | placeholder | same guess as team-a's webcam
webcam.limelightCamera.aprilTags=field
