# The robot Hive Auto Red and Blue in TeamCode/.../KimCode run on.
# Same keys as harness.properties, only the ones that differ (see ../README.md, "drive.properties").
# Nothing here was measured on this robot.

# The OpModes that run on this robot: Driver Station name or class name.
forOpModes=HiveAutoRed, HiveAutoBlue

robot.name=Hive

# The names Hive Auto passes to hardwareMap.
drive.frontLeft=fl
drive.frontRight=fr
drive.rearLeft=bl
drive.rearRight=br
hardware.otherMotors=pollen, intake
devices.limelights=limelight
devices.blinkers=Control Hub

# The directions in pedro/Constants.java, so the simulated robot does what Pedro expects. TeleopV1
# sets fl and br the other way, and only one of the two can match the real robot. With TeleopV1's
# directions here, Hive Auto drives into the wall. The team has to check which is right, and the
# team found two swapped drive motor wires on 2026-11-04. Left as they are until then.
drive.frontLeft.direction=FORWARD
drive.frontRight.direction=FORWARD
drive.rearLeft.direction=REVERSE
drive.rearRight.direction=REVERSE

drive.forwardSpeedInchesPerSecond=51.46027911925872 | placeholder | pedro/Constants.java, tuned before the swapped wires were found
drive.strafeSpeedInchesPerSecond=43.81249145338436 | placeholder | pedro/Constants.java, tuned before the swapped wires were found
drive.forwardCoastInchesPerSecondSquared=43.21206932789607 | placeholder | pedro/Constants.java, tuned before the swapped wires were found
drive.lateralCoastInchesPerSecondSquared=59.876637119194335 | placeholder | pedro/Constants.java, tuned before the swapped wires were found
robot.lengthInches=18 | placeholder | not measured; FTC maximum starting size
robot.widthInches=18 | placeholder | not measured; FTC maximum starting size
drive.turnRateDegreesPerSecond=180 | placeholder | guess, not measured on this robot
drive.responseTimeSeconds=0.10 | placeholder | guess, not measured on this robot
drive.maxAccelerationInchesPerSecondSquared=200 | placeholder | guess, not measured on this robot
drive.speedVoltage=12.5 | placeholder | guess, not measured on this robot
