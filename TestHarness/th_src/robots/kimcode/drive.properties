# KimCode's robot: the robot TeleopV1 and SimpleLeave in TeamCode/.../KimCode are written for.
# Same keys as harness.properties, only the ones that differ (see ../README.md, "drive.properties").
# Nothing here was measured on this robot.

# The OpModes that run on this robot: Driver Station name or class name.
forOpModes=TeleopV1, SimpleLeave

robot.name=KimCode

# The names TeleopV1 and SimpleLeave pass to hardwareMap.get(...).
drive.frontLeft=fl
drive.frontRight=fr
drive.rearLeft=bl
drive.rearRight=br
hardware.otherMotors=
devices.limelights=limelight
devices.blinkers=Control Hub

# The directions TeleopV1 sets. SimpleLeave disagrees on two of them (it sets fl FORWARD and br
# REVERSE), so with these it strafes instead of driving forward. Only one of the two can match the
# real robot; the team has to check which. Left as they are until then.
drive.frontLeft.direction=REVERSE
drive.frontRight.direction=FORWARD
drive.rearLeft.direction=REVERSE
drive.rearRight.direction=FORWARD

# Team A's numbers, so the robot moves at all. Marked as guesses here: some are measured on Team
# A's robot, but none on this one.
drive.forwardSpeedInchesPerSecond=62.61374213751846 | placeholder | Team A's speed, not measured on this robot
drive.strafeSpeedInchesPerSecond=49.757958599901585 | placeholder | Team A's speed, not measured on this robot
drive.forwardCoastInchesPerSecondSquared=42.4832745291992 | placeholder | Team A's coasting, not measured on this robot
drive.lateralCoastInchesPerSecondSquared=50.60694780564594 | placeholder | Team A's coasting, not measured on this robot
robot.lengthInches=18 | placeholder | not measured; FTC maximum starting size
robot.widthInches=18 | placeholder | not measured; FTC maximum starting size
drive.turnRateDegreesPerSecond=180 | placeholder | Team A's guess, not measured on this robot
drive.responseTimeSeconds=0.10 | placeholder | Team A's guess, not measured on this robot
drive.maxAccelerationInchesPerSecondSquared=200 | placeholder | Team A's guess, not measured on this robot
drive.speedVoltage=12.5 | placeholder | Team A's guess, not measured on this robot
