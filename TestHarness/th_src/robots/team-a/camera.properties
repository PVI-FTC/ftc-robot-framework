# Team A's cameras. This file is the only place they are set (see ../README.md, "camera.properties").

# The robot's webcams (comma-separated). Empty means no webcam.
devices.webcams=logitechVisionWebcam
# For each webcam above, where it sits and what it sees (webcam.<name>.<fact>), as facts. The mount
# is from the robot's center on the floor: forward, left (negative: right) and up. Angles 0, 0, 0
# mean level and looking straight forward; yaw + turns the lens left, pitch + tilts it up, roll +
# turns the picture clockwise seen from behind. maxRangeInches: farthest tag it still reads;
# maxViewAngleDegrees: how far a tag may be turned away and still be read.
webcam.logitechVisionWebcam.forwardInches=4.875 | measured | TeamCode TeamAAprilTagVisionRobot CAMERA_FORWARD_INCHES
webcam.logitechVisionWebcam.leftInches=-6.875 | measured | TeamCode TeamAAprilTagVisionRobot CAMERA_RIGHT_INCHES 6.875 (right is negative left)
webcam.logitechVisionWebcam.upInches=19.0 | measured | TeamCode TeamAAprilTagVisionRobot CAMERA_UP_INCHES
webcam.logitechVisionWebcam.yawDegrees=0 | measured | TeamCode TeamAAprilTagVisionRobot mount angles 0, 0, 0 (level, facing forward)
webcam.logitechVisionWebcam.pitchDegrees=18 | placeholder | tilted up in this file to see the HIVE's raised tags (UnityBot C24: the smallest tilt that sees tags 34-37/42-45 from 48 in and keeps every lower-row tag); TeamCode's TeamAAprilTagVisionRobot still says level (0)
webcam.logitechVisionWebcam.rollDegrees=0 | measured | TeamCode TeamAAprilTagVisionRobot mount angles 0, 0, 0 (level, facing forward)
webcam.logitechVisionWebcam.horizontalFovDegrees=65.9 | placeholder | not measured; Logitech's 78 degree diagonal for the C920, split for a 4:3 picture assuming 640 x 480 isn't cropped
webcam.logitechVisionWebcam.verticalFovDegrees=51.8 | placeholder | not measured; Logitech's 78 degree diagonal for the C920, split for a 4:3 picture assuming 640 x 480 isn't cropped
webcam.logitechVisionWebcam.imageWidthPixels=640 | measured | TeamCode TeamAAprilTagVisionRobot STREAM_WIDTH
webcam.logitechVisionWebcam.imageHeightPixels=480 | measured | TeamCode TeamAAprilTagVisionRobot STREAM_HEIGHT
webcam.logitechVisionWebcam.maxRangeInches=120 | placeholder | not measured; a guess (10 ft) for a field AprilTag at 640 x 480
webcam.logitechVisionWebcam.maxViewAngleDegrees=60 | placeholder | not measured; AprilTag detection gets unreliable past about 60 to 70 degrees
# field: the webcam sees the field's tags that are in view; script: only what a test's AprilTagScript says.
webcam.logitechVisionWebcam.aprilTags=field
